openapi: 3.1.0
info:
  title: IdeaFlow 编排器 API（目标态 v2.1）
  version: "2.1"
  description: >-
    与当前实现相比新增两处契约：/api/start 接受 spec.json（第二条入口），
    /api/progress 返回 decisions。两处实现前，对应断言保持 skip。
servers:
  - url: http://127.0.0.1:8000
paths:
  /api/start:
    post:
      summary: 上传需求、任务清单或设计规格，拆解并建图
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRequest"
      responses:
        "200":
          description: 已接受
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: ["accepted", "progress"]
                properties:
                  accepted: { type: boolean }
                  progress: { $ref: "#/components/schemas/Progress" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: SPEC_BLOCKED_NO_QUESTION，details.audit 包含阻断问题
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: 需求模块不可用，想法入口无法生成规格
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/events:
    post:
      summary: AI 回报、人工操作、变更、恢复
      description: >-
        计划门使用 human_op。页面提交 approve 或 return 时应带上当前 plan_id、plan_version。
        为兼容命令行，当前计划门接受不带版本的 approve，并在入队时绑定当前版本。
        return 需要计划引用、return_to（spec 或 plan）及非空 reason。退回 spec 还须带同 ID、已过审的下一版 spec。
        事件入队不表示动作已生效，通过 Progress.decisions 和 last_error 查询结果。
      responses:
        "202":
          description: 已入队
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: ["accepted"]
                properties:
                  accepted: { type: boolean }
                  queue_size: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/progress:
    get:
      summary: 查询进度；带 since/limit 返回增量事件
      parameters:
        - { name: since, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000 } }
      responses:
        "200":
          description: 当前状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/health:
    get:
      summary: 健康检查
      responses:
        "200": { description: OK }
  /api/spec/item:
    patch:
      summary: 修改需求快照条目并重新出规格（成员 2）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecItemPatch" }
      responses:
        "200":
          description: 已生成新版本规格与审计
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: ["spec", "audit"]
                properties:
                  spec: { $ref: "#/components/schemas/SpecSummary" }
                  audit: { $ref: "#/components/schemas/SpecAudit" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: UNKNOWN_ITEM，条目不存在
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "409":
          description: STALE_ITEM，item_version 与当前不一致，状态保持不变
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: INVALID_TEXT，文本为空或超长
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/graph/edit:
    post:
      summary: 编辑依赖图并复校（成员 4）
      description: >-
        乐观锁：请求携带 plan_version，成功则版本 +1、写 plan_edited 与 graph_validated、
        重新进入 waiting_human（gate_type=plan_approval）。失败不入队，事件流不新增。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GraphEditRequest" }
      responses:
        "200":
          description: 已生成新版本计划
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphEditResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: PLAN_VERSION_STALE，或图不合法（GRAPH_CYCLE / GRAPH_DANGLING / GRAPH_SELF_DEP / GRAPH_DUP_ID / GRAPH_TASK_STARTED），details 带具体对象
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "422":
          description: INVALID_OP，操作不受支持或参数缺失
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/replay:
    get:
      summary: 回放到指定事件序号（成员 3）
      parameters:
        - { name: seq, in: query, required: true, schema: { type: integer, minimum: 0 } }
      responses:
        "200":
          description: 处理完第 seq 条事件后的状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayResult" }
        "400":
          description: SEQ_OUT_OF_RANGE，序号超出范围
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /api/summary:
    get:
      summary: 运行总结（成员 3）
      responses:
        "200":
          description: 终态总结
          content:
            application/json:
              schema: { $ref: "summary.schema.json" }
        "409":
          description: NOT_TERMINAL，实例未进入终态
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
components:
  responses:
    BadRequest:
      description: 请求非法
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: 实例已启动，或规格缺少审批、需要人工决策、绑定或状态不一致
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: ["error"]
      properties:
        error: { type: string }
        last_error: { type: string }
        message: { type: string }
        details: { type: object }
    StartRequest:
      description: >-
        四选一，但「想法」入口必须经需求模块：收到 requirement 时，
        编排器先取回需求模块产出的设计规格（spec），再交给 plan_adapter 分解，
        不允许绕过规格直接拆任务（旧的 pm_breakdown 捷径废弃）。
        另三种入口为任务数组（夹具与联调）、plan.json、spec.json。
      oneOf:
        - $ref: "#/components/schemas/RequirementStart"
        - $ref: "#/components/schemas/TasksStart"
        - $ref: "plan.schema.json"
        - $ref: "spec.schema.json"
    RequirementStart:
      type: object
      additionalProperties: false
      required: ["requirement"]
      description: >-
        一句话想法。编排器须经需求模块生成规格后再分解，
        响应中的 plan_id 与 spec_version 必须来自该规格。
      properties:
        requirement: { type: string, minLength: 1 }
        spec_version: { type: string }
    TasksStart:
      type: object
      additionalProperties: false
      required: ["tasks"]
      properties:
        tasks:
          type: array
          minItems: 1
          items: { $ref: "plan.schema.json#/properties/tasks/items" }
        spec_version: { type: string }
        list_version: { type: string }
    Progress:
      type: object
      additionalProperties: true
      required: ["instance_id", "status", "total", "tasks"]
      properties:
        instance_id: { type: string }
        status:
          $ref: "enums.schema.json#/$defs/instanceStatus"
        plan_id:
          type: [string, "null"]
          description: 启动后是当前计划号；任务清单入口会分配计划号
        plan_version:
          type: [integer, "null"]
          minimum: 1
          description: 当前可审批的计划版本，未启动时为空
        can_return_spec:
          type: boolean
          description: 当前待批计划有可退回的规格正文
        mode:
          $ref: "enums.schema.json#/$defs/runMode"
        phase:
          type: string
          description: 当前阶段，供时间线与回放分组
          enum: [discussion, snapshot, draft, review, spec, plan, graph, execution, delivery]
        plan_review:
          description: 当前计划版本的质量检查结果；未生成计划时为 null
          oneOf:
            - $ref: "#/components/schemas/PlanReview"
            - type: "null"
        spec:
          description: 规格摘要；任务清单入口或未启动时为 null
          oneOf:
            - $ref: "#/components/schemas/SpecSummary"
            - type: "null"
        spec_version: { type: string }
        list_version: { type: string }
        graph_id: { type: string }
        total: { type: integer, minimum: 0 }
        done: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        blocked: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        running: { type: integer, minimum: 0 }
        pending: { type: integer, minimum: 0 }
        percent: { type: number, minimum: 0, maximum: 100 }
        waiting_on:
          description: 当前人工门；无等待时为 null
          oneOf:
            - type: "object"
              additionalProperties: false
              required: ["gate_type", "waiting_for", "object_id", "since"]
              properties:
                gate_type:
                  $ref: "enums.schema.json#/$defs/gateType"
                waiting_for: { type: string, const: "human" }
                object_id: { type: string }
                since:
                  $ref: "enums.schema.json#/$defs/timestamp"
            - type: "null"
        edges:
          type: array
          description: 当前依赖边，前端据此画图
          items: { $ref: "#/components/schemas/Edge" }
        analysis:
          type: string
          description: 最近一次依赖分析的结论
        last_error:
          type: string
          description: 最近一次数据包处理失败的原因，成功后清空
        tasks:
          type: array
          items: { $ref: "#/components/schemas/TaskState" }
        layers:
          type: array
          items: { type: array, items: { type: string } }
        execution_order:
          type: array
          items: { type: string }
        decisions:
          type: array
          description: 按发生顺序返回；无人工操作时为空数组
          items: { $ref: "decision.schema.json" }
        delivery:
          description: 全部任务终态后生成；确认前 status=draft，实例停留在 delivery_pending
          oneOf:
            - $ref: "delivery.schema.json"
            - type: "null"
    TaskState:
      type: object
      additionalProperties: true
      required: ["task_id", "name", "status"]
      properties:
        task_id: { type: string }
        name: { type: string }
        status:
          $ref: "enums.schema.json#/$defs/taskStatus"
        attempts: { type: integer, minimum: 0 }
        suggested_role: { $ref: "enums.schema.json#/$defs/role" }
        priority: { $ref: "enums.schema.json#/$defs/priority" }
        deliverable: { type: string }
        acceptance_items:
          type: array
          items: { type: string }
        requirement_refs:
          type: array
          description: 追到需求条款（R-xx），计划经 plan_adapter 带入
          items: { type: string }
        design_refs:
          type: array
          description: 追到设计模块（M-xx）
          items: { type: string }
        depends_on:
          type: array
          description: 前置任务号（T1），供前端画局部依赖
          items: { type: string }
        write_paths:
          type: array
          description: 该任务允许改写的路径，执行侧据此限权
          items: { type: string }
        estimate_days: { type: number, minimum: 0 }
        review_required: { type: boolean }
        artifact_ids:
          type: array
          description: 任务完成后登记的产物编号（ART-xx）
          items: { type: string }
        kind:
          $ref: "enums.schema.json#/$defs/taskKind"
        started_at:
          description: 进入 running 的时间；未开始为 null
          oneOf:
            - $ref: "enums.schema.json#/$defs/timestamp"
            - type: "null"
        finished_at:
          description: 进入终态的时间；未结束为 null
          oneOf:
            - $ref: "enums.schema.json#/$defs/timestamp"
            - type: "null"
        evidence:
          type: array
          description: 该任务的证据摘要；passed 必须有证据支撑
          items: { $ref: "#/components/schemas/EvidenceSummary" }
    Edge:
      type: object
      additionalProperties: false
      required: ["from", "to", "type"]
      properties:
        from: { type: string }
        to: { type: string }
        type:
          $ref: "enums.schema.json#/$defs/edgeType"
        reason: { type: string }
    EvidenceSummary:
      type: object
      additionalProperties: false
      required: ["artifact_id", "exit_code"]
      properties:
        artifact_id: { type: string }
        kind: { $ref: "enums.schema.json#/$defs/taskKind" }
        exit_code: { type: integer }
        duration_ms: { type: integer, minimum: 0 }
    PlanReview:
      type: object
      additionalProperties: false
      required: ["plan_id", "counts", "issues"]
      properties:
        plan_id: { type: string }
        spec_ref:
          type: [object, "null"]
          additionalProperties: false
          required: ["spec_id", "version", "hash"]
          properties:
            spec_id: { type: string }
            version: { type: integer, minimum: 1 }
            hash: { $ref: "enums.schema.json#/$defs/hash" }
        counts:
          type: object
          additionalProperties: false
          required: ["blocking", "major", "minor", "total"]
          properties:
            blocking: { type: integer, minimum: 0 }
            major: { type: integer, minimum: 0 }
            minor: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        issues:
          type: array
          items:
            type: object
            additionalProperties: true
            required: ["code", "severity", "message"]
            properties:
              code: { type: string }
              severity: { type: string, enum: [blocking, major, minor] }
              task_id: { type: string }
              estimate_days: { type: number }
              message: { type: string }
    SpecSummary:
      type: object
      additionalProperties: false
      required: ["spec_id", "version", "status"]
      properties:
        spec_id: { type: string }
        version: { type: integer, minimum: 1 }
        hash: { $ref: "enums.schema.json#/$defs/hash" }
        status: { $ref: "enums.schema.json#/$defs/specStatus" }
        review_status: { type: string }
        audit_counts:
          type: object
          additionalProperties: false
          required: ["blocking", "major", "minor", "total"]
          properties:
            blocking: { type: integer, minimum: 0 }
            major: { type: integer, minimum: 0 }
            minor: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
    SpecAudit:
      type: object
      additionalProperties: true
      required: ["counts", "passed"]
      properties:
        counts:
          type: object
          additionalProperties: false
          required: ["blocking", "major", "minor", "total"]
          properties:
            blocking: { type: integer, minimum: 0 }
            major: { type: integer, minimum: 0 }
            minor: { type: integer, minimum: 0 }
            total: { type: integer, minimum: 0 }
        passed: { type: boolean }
    SpecItemPatch:
      type: object
      additionalProperties: false
      required: ["run_id", "item_id", "text", "actor"]
      properties:
        run_id: { type: string, minLength: 1 }
        item_id:
          type: string
          description: 快照条目号，R/C/Q 前缀
          pattern: '^[RCQ]-\d+$'
        text: { type: string, minLength: 1, maxLength: 500 }
        item_version: { type: integer, minimum: 1 }
        actor: { type: string, minLength: 1 }
        reason: { type: string }
    GraphEditRequest:
      type: object
      additionalProperties: false
      required: ["plan_id", "plan_version", "ops"]
      properties:
        plan_id: { type: string }
        plan_version: { type: integer, minimum: 1 }
        actor: { type: string }
        reason: { type: string }
        ops:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/GraphEditOp" }
    GraphEditOp:
      type: object
      additionalProperties: false
      required: ["op"]
      properties:
        op:
          type: string
          enum: [add_edge, del_edge, set_edge_type, add_task, del_task, split_task]
        from: { type: string }
        to: { type: string }
        type: { $ref: "enums.schema.json#/$defs/edgeType" }
        task_id: { type: string }
        name: { type: string }
        kind: { $ref: "enums.schema.json#/$defs/taskKind" }
        depends_on:
          type: array
          items: { type: string }
        tasks:
          type: array
          items: { type: object, additionalProperties: true }
    GraphEditResult:
      type: object
      additionalProperties: false
      required: ["plan", "edges", "layers"]
      properties:
        plan:
          type: object
          additionalProperties: false
          required: ["plan_id", "version"]
          properties:
            plan_id: { type: string }
            version: { type: integer, minimum: 1 }
        edges:
          type: array
          items: { $ref: "#/components/schemas/Edge" }
        layers:
          type: array
          items: { type: array, items: { type: string } }
    ReplayResult:
      type: object
      additionalProperties: false
      required: ["state", "at"]
      properties:
        state: { $ref: "#/components/schemas/Progress" }
        at: { $ref: "enums.schema.json#/$defs/timestamp" }
